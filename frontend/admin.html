<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <header>
        <div class="logo">Campus Lost & Found</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Student Dashboard</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>
    <!-- Admin Dashboard -->
    <section class="dashboard-section">
        <h1>Admin Dashboard</h1>
        <p>Manage reported items and student claims.</p>
        <!-- Statistics -->
        <div class="dashboard-cards">
            <div class="dashboard-card">
                <h2 id="totalItems">0</h2>
                <p>Total Items</p>
            </div>
            <div class="dashboard-card">
                <h2 id="lostItems">0</h2>
                <p>Lost Items</p>
            </div>
            <div class="dashboard-card">
                <h2 id="foundItems">0</h2>
                <p>Found Items</p>
            </div>
            <div class="dashboard-card">
                <h2 id="totalClaims">0</h2>
                <p>Total Claims</p>
            </div>
        </div>
        <!-- Reported Items -->
        <h2 class="dashboard-heading">Manage Reported Items</h2>
        <div id="adminItemList" class="item-container"></div>
        <!-- Student Claims -->
        <h2 class="dashboard-heading">Manage Student Claims</h2>
        <div id="adminClaimList" class="item-container"></div>
    </section>
    <!-- Footer -->
    <footer>
        <p>Campus Lost and Found Portal | Sai University</p>
    </footer>
    <script src="admin.js?v=2"></script>
</body>
</html>
